name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, e.g. 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  unsigned-reproducible-artifacts:
    name: Build unsigned reproducible artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
      - run: scripts/reproducible-build.sh
      - run: scripts/generate-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-reproducible-artifacts
          path: |
            release/repro/*
            release/sbom/*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/repro/*.zip'

  linux-sign:
    name: Linux detached GPG signatures
    runs-on: ubuntu-latest
    needs: unsigned-reproducible-artifacts
    if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-reproducible-artifacts
          path: release
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in release/repro/*.zip; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-signatures
          path: 'release/repro/*.asc'

  macos-sign-notarize:
    name: macOS sign/notarize placeholder
    runs-on: macos-latest
    needs: unsigned-reproducible-artifacts
    if: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-reproducible-artifacts
          path: release
      - name: Signing instructions
        run: |
          echo "Add Apple Developer ID certificate import, codesign, notarytool submit, staple, and spctl verification here."
          echo "Required secrets: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD."
          exit 1

  windows-sign:
    name: Windows Authenticode placeholder
    runs-on: windows-latest
    needs: unsigned-reproducible-artifacts
    if: ${{ secrets.WINDOWS_SIGNING_CERT_PFX != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-reproducible-artifacts
          path: release
      - name: Signing instructions
        shell: pwsh
        run: |
          Write-Host "Add PFX import and signtool sign /tr timestamp flow here."
          Write-Host "Required secrets: WINDOWS_SIGNING_CERT_PFX, WINDOWS_SIGNING_CERT_PASSWORD."
          exit 1

  github-release:
    name: Publish GitHub Release draft
    runs-on: ubuntu-latest
    needs: unsigned-reproducible-artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-reproducible-artifacts
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            release/repro/*
            release/sbom/*
          body: |
            Draft release generated by CI.

            Before publishing stable:
            - Attach signed platform binaries.
            - Attach GPG detached signatures.
            - Attach notarization/AuthentiCode verification logs.
            - Confirm SBOM and provenance attestations.
            - Confirm external security audit sign-off.
