name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension lint/typecheck/unit/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci
      - run: npm --prefix extension run lint
      - run: npm --prefix extension run typecheck
      - run: npm --prefix extension run test:unit
      - run: npm --prefix extension run build
      - name: Build Firefox manifest variant
        run: npm --prefix extension run build:firefox
      - run: npm --prefix extension audit --audit-level=high

  proxy:
    name: Proxy fmt/clippy/test/build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
      - run: cargo fmt --manifest-path proxy/Cargo.toml --check
      - run: cargo clippy --manifest-path proxy/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path proxy/Cargo.toml --all-targets
      - run: cargo build --manifest-path proxy/Cargo.toml --release

  browser-e2e:
    name: Browser E2E - Chromium extension/proxy coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
      - run: npm --prefix extension ci
      - run: npm --prefix extension run build
      - run: cargo build --manifest-path proxy/Cargo.toml --release
      - run: npx --prefix extension playwright install --with-deps chromium
      - run: FACADEPROXY_PROXY_BIN=../proxy/target/release/facadeproxy npm --prefix extension run test:e2e

  supply-chain:
    name: Supply-chain audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix extension ci
      - run: npm --prefix extension audit --audit-level=high
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: proxy
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
        working-directory: proxy
      - name: Generate npm SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-extension.json
        working-directory: extension
      - name: Generate Rust SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path proxy/Cargo.toml --format json --output-cdx sbom-proxy.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            extension/sbom-extension.json
            sbom-proxy.json
