[package]
name = "facadeproxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Localhost persona-aware HTTP proxy for FacadeProxy"

[lib]
name = "facadeproxy"
path = "src/lib.rs"

[[bin]]
name = "facadeproxy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
http = "0.2"
hyper = { version = "0.14", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
